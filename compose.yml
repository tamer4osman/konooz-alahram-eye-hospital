services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # .env points DATABASE_URL at localhost (host workflow); inside the
      # container the db service is reachable as "db".
      DATABASE_URL: postgresql://konooz:konooz_password@db:5432/konooz?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: konooz
      POSTGRES_PASSWORD: konooz_password
      POSTGRES_DB: konooz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konooz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
